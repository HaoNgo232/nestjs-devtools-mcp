name: NestJS DevTools CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build & Test — mỗi commit / PR
  # ──────────────────────────────────────────────
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm run lint

      - name: Build monorepo
        run: pnpm build

      - name: Test monorepo
        run: pnpm test

  # ──────────────────────────────────────────────
  # Job 2: Publish — chỉ khi push tag v*
  # ──────────────────────────────────────────────
  publish:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # ── Extract version từ git tag ──
      - name: Extract version from tag
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "value=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${TAG_VERSION}"

      # ── Inject version vào các package.json (không dùng npm version để tránh lifecycle conflict) ──
      - name: Sync version
        run: |
          node -e "
            const fs = require('fs');
            const version = '${{ steps.version.outputs.value }}';
            const files = [
              './packages/plugin/package.json',
              './packages/server/package.json'
            ];
            files.forEach(f => {
              const pkg = JSON.parse(fs.readFileSync(f, 'utf8'));
              pkg.version = version;
              fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + '\n');
              console.log('Updated', f, 'to v' + version);
            });
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        run: pnpm build

      # ── Publish cả hai package ──
      - name: Publish @nestjs-devtools-mcp/plugin
        working-directory: ./packages/plugin
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish nestjs-devtools-mcp (Bridge)
        working-directory: ./packages/server
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Verify publish thành công ──
      - name: Verify published versions
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          echo "Doi npm registry cap nhat..."
          sleep 15
          pnpm info "@nestjs-devtools-mcp/plugin" version | grep "${VERSION}"
          pnpm info "nestjs-devtools-mcp" version | grep "${VERSION}"
          echo "Ca hai package da publish thanh cong!"
