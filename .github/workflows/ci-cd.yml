name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint

      - name: Run Tests
        run: pnpm run test

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

  publish:
    name: Version & Publish to NPM
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Auto Version & Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if any .changeset/*.md files exist
          CHANGESET_COUNT=$(find .changeset -name "*.md" ! -name "README.md" | wc -l)

          if [ "$CHANGESET_COUNT" -gt 0 ]; then
            echo "Found $CHANGESET_COUNT changeset file(s). Consuming changesets..."
            pnpm changeset version
          else
            echo "No changeset found. Auto-bumping patch version..."
            node -e "
              const fs = require('fs');
              const files = ['./packages/plugin/package.json', './packages/server/package.json', './package.json'];
              const pluginPkg = JSON.parse(fs.readFileSync(files[0], 'utf8'));
              const parts = pluginPkg.version.split('.');
              parts[2] = parseInt(parts[2], 10) + 1;
              const newVer = parts.join('.');
              files.forEach(file => {
                if (fs.existsSync(file)) {
                  const p = JSON.parse(fs.readFileSync(file, 'utf8'));
                  p.version = newVer;
                  fs.writeFileSync(file, JSON.stringify(p, null, 2) + '\n');
                  console.log('Bumped ' + file + ' to ' + newVer);
                }
              });
            "
          fi

          # Build freshly versioned packages
          pnpm run build

          # Publish packages to NPM
          pnpm --filter "./packages/*" publish --access public --no-git-checks

          # Commit updated package.json files back to main
          git add .
          git commit -m "chore(release): auto bump version [skip ci]" || echo "No version changes to commit"
          git push origin main
