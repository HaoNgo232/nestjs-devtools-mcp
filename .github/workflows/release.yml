name: Release

# Chỉ chạy khi push tag v*
# CI (build & test) đã được handle bởi ci.yml — không lặp lại ở đây
on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # ── Extract version từ git tag (ví dụ: refs/tags/v0.1.7 → 0.1.7) ──
      - name: Extract version from tag
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "value=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${TAG_VERSION}"

      # ── Inject version vào ALL package.json files ──
      - name: Sync version into package.json files
        run: |
          node -e "
            const fs = require('fs');
            const version = '${{ steps.version.outputs.value }}';
            const files = [
              './package.json',
              './packages/plugin/package.json',
              './packages/server/package.json',
              './demo-app/package.json'
            ];
            files.forEach(f => {
              if (!fs.existsSync(f)) return;
              const pkg = JSON.parse(fs.readFileSync(f, 'utf8'));
              pkg.version = version;
              fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + '\n');
              console.log('Updated', f, 'to v' + version);
            });
          "

      - name: Install dependencies
        run: pnpm install

      # ── Chỉ build Plugin và Bridge để publish, bỏ qua demo-app ──
      - name: Build packages
        run: pnpm run build --filter "@nestjs-devtools-mcp/plugin" --filter "nestjs-devtools-mcp"

      # ── Publish Plugin ──
      - name: Publish @nestjs-devtools-mcp/plugin
        working-directory: ./packages/plugin
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Publish Bridge ──
      - name: Publish nestjs-devtools-mcp (Bridge)
        working-directory: ./packages/server
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Xác nhận publish thành công ──
      - name: Verify published versions
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          echo "Doi npm registry cap nhat (15s)..."
          sleep 15
          pnpm info "@nestjs-devtools-mcp/plugin" version | grep "${VERSION}"
          pnpm info "nestjs-devtools-mcp" version | grep "${VERSION}"
          echo "Ca hai package da publish thanh cong v${VERSION}!"
